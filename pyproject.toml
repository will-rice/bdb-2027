[project]
name = "bdb-2027"
version = "0.1.0"
description = "NFL Big Data Bowl 2027: Tracking prospect movement and regular season performance."
readme = "README.md"
authors = [{ name = "Will Rice", email = "wrice20@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "git-python>=1.1.1",
  "httpx>=0.28.1",
  "kaggle>=1.7.4.5",
  "kagglesdk>=0.1.0",
  "lightgbm>=4.6.0",
  "lightning>=2.6.6",
  "matplotlib>=3.10.0",
  "nbformat>=5.10.4",
  "pandas>=2.2.0",
  "polars>=1.20.0",
  "pre-commit>=4.6.2",
  "pyarrow>=19.0.0",
  "pydantic>=2.13.5",
  "pydocstyle>=6.3.0",
  "pytest>=9.1.1",
  "python-dotenv>=1.2.3",
  "rich>=13.9.4",
  "ruff>=0.16.8",
  "scikit-learn>=1.6.0",
  "scipy>=1.15.0",
  "seaborn>=0.13.2",
  "shapely>=2.0.7",
  "statsmodels>=0.15.0",
  "torch>=2.14.0",
  "torchaudio>=2.11.0",
  "torchcodec>=0.16.0",
  "torchvision>=0.29.0",
  "ty>=0.0.83",
  "wandb>=0.30.0",
  "xgboost>=2.1.4",
]

[build-system]
requires = ["uv_build>=0.12.18"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["bdb_2027"]

[tool.uv.sources]
git-python = { git = "https://github.com/pynickle/git-python.git" }

[tool.ruff.lint.isort]
known-first-party = ["bdb_2027"]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W", "D", "N", "B", "PTH", "ANN"]
ignore = ["D107", "N806", "E501"]
exclude = [".venv", "scratch", ".agents", "notebooks"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[project.scripts]
train = "bdb_2027.scripts.train:main"
download-data = "bdb_2027.scripts.download_data:main"
run-analysis = "bdb_2027.scripts.run_translation_analysis:run_analysis"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".agents", ".venv", "dist", "build"]

[dependency-groups]
dev = ["ipykernel>=7.4.0", "nbconvert>=7.17.1"]
